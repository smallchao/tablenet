[workspace]
resolver = "2"
members = [
    "tablenet-proto",
    "tablenet-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
tablenet-proto = { path = "tablenet-proto" }
tablenet-client = { path = "tablenet-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal", "fs"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ed25519-dalek = "2"
data-encoding = "2"
getrandom = "0.2"
